name: quick

# Cheap per-push check for lunobot/** branches (own work branches and
# lunobot/staging): one linux job instead of ci.yml's 40+ checks. The full
# matrix runs once per train PR (LUNOBOT.md § 7.2 in unxed/lunobot).
on:
  push:
    branches:
      - 'lunobot/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - run: go vet ./...

      - run: go test -count=1 -timeout 4m ./...
